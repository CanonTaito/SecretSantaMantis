<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link preview picture (Facebook, Messenger, WhatsApp…). Edit, then run `npm run og-image`. -->
  <defs>
    <radialGradient id="glow-red" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#c8323b" stop-opacity="0.12" />
      <stop offset="1" stop-color="#c8323b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-green" cx="90%" cy="15%" r="65%">
      <stop offset="0" stop-color="#2f7a55" stop-opacity="0.14" />
      <stop offset="1" stop-color="#2f7a55" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#fbf7ef" />
  <rect width="1200" height="630" fill="url(#glow-red)" />
  <rect width="1200" height="630" fill="url(#glow-green)" />
  <rect width="1200" height="14" fill="#c8323b" />
  <rect y="616" width="1200" height="14" fill="#1f4d3a" />

  <!-- confetti -->
  <g opacity="0.85">
