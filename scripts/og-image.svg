    <circle cx="1120" cy="560" r="11" fill="#c8323b" />
    <circle cx="1090" cy="90" r="7" fill="#2f7a55" />
    <circle cx="70" cy="560" r="8" fill="#e3b341" />
    <rect x="515" y="520" width="16" height="16" rx="3" fill="#2f7a55" transform="rotate(20 523 528)" />
    <rect x="1010" y="440" width="14" height="14" rx="3" fill="#e3b341" transform="rotate(35 1017 447)" />
  </g>

